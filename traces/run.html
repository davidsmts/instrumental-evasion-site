<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace &middot; Instrumental Monitor Evasion</title>
<meta name="description" content="One monitored episode: agent timeline, every monitor decision with its reason, and scoring details.">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/common.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="../index.html" class="logo"><span class="mark-dot"></span>Instrumental Monitor Evasion</a>
    <a href="index.html" class="logo-sub">/ traces</a>
    <span class="topbar-spacer"></span>
    <a class="topbar-link" href="https://posttrainbench.com/" target="_blank" rel="noopener">Inspired by PostTrainBench</a>
    <span class="topbar-meta" id="topbar-meta"></span>
  </div>
</header>

<div class="layout">
  <!-- LEFT RAIL: what this run is, and how it was scored. -->
  <aside class="rail">
    <a href="index.html" class="back-link" id="back-link">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to all runs
    </a>

    <div class="rail-card">
      <h1 class="summary-title" id="s-title">&ndash;</h1>
      <div class="summary-sub" id="s-sub"></div>

      <div class="verdict-block">
        <div class="verdict-big" id="s-outcome">&ndash;</div>
        <div class="verdict-headline" id="s-basis"></div>
      </div>
      <div class="policy-box" id="s-policy"></div>

      <dl class="rail-stats" id="s-stats"></dl>

      <div class="rail-section-label">Evidence</div>
      <div class="coverage" id="s-coverage"></div>

      <div class="rail-section-label">Attempt id</div>
      <div class="run-id" id="s-runid" title="Click to copy"><code id="s-runid-text"></code></div>
    </div>
  </aside>

  <main>
    <nav class="tab-nav" role="tablist">
      <button class="tab-btn active" data-tab="trace" role="tab">Run trace</button>
      <button class="tab-btn" data-tab="decisions" role="tab">Monitor decisions</button>
      <button class="tab-btn" data-tab="setup" role="tab">Setup &amp; scoring</button>
    </nav>

    <section id="tab-trace" class="section active">
      <header class="toolbar">
        <span id="event-count" class="muted"></span>
        <span class="spacer"></span>
        <label class="toggle-label"><input type="checkbox" id="expand-outputs"> expand outputs</label>
        <input type="number" id="jump" class="jump" min="1" placeholder="call #" aria-label="Jump to call number">
      </header>
      <div id="trace-note" class="source-note"></div>
      <div id="trace" class="timeline"></div>
    </section>

    <section id="tab-decisions" class="section">
      <div id="decisions"></div>
    </section>

    <section id="tab-setup" class="section">
      <div id="setup"></div>
    </section>
  </main>
</div>

<script src="assets/run.js"></script>
</body>
</html>
